{% extends "base.html" %}
{% block title %}Post New Assignment{% endblock %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="glass-card p-5">
                <div class="text-center mb-5">
                    <div class="p-4 bg-primary bg-opacity-10 rounded-circle d-inline-block mb-3">
                        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-primary"><path d="M12 2L2 7l10 5 10-5-10-5z"></path><path d="M2 17l10 5 10-5"></path><path d="M2 12l10 5 10-5"></path></svg>
                    </div>
                    <h3 class="fw-bold mb-1">Create <span class="text-gradient">New Task</span></h3>
                    <p class="text-muted small">Design a new learning challenge for your students</p>
                </div>

                <form method="POST" enctype="multipart/form-data">
                    <div class="mb-4">
                        <label class="form-label text-muted small fw-bold text-uppercase">Topic Title</label>
                        <input type="text" name="topic" class="form-control" placeholder="e.g. Data Structures Mastery" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-muted small fw-bold text-uppercase">Detailed Instructions</label>
                        <textarea name="description" class="form-control" rows="5" placeholder="Explain the assignment requirements..." required></textarea>
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-muted small fw-bold text-uppercase">Assignment Document (PDF/DOCX)</label>
                        <input type="file" name="attachment" class="form-control">
                    </div>
                    <div class="row mb-5">
                        <div class="col-md-6">
                            <label class="form-label text-muted small fw-bold text-uppercase">Start Date</label>
                            <input type="date" name="start_date" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-muted small fw-bold text-uppercase">End Date</label>
                            <input type="date" name="end_date" class="form-control" required>
                        </div>
                    </div>
                    <button type="submit" class="btn-premium w-100 py-3 mb-4">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="me-2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                        Launch Assignment
                    </button>
                </form>

                <div class="text-center">
                    <a href="{{ url_for('tutor.dashboard') }}" class="text-muted small text-decoration-none">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="me-1"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                        Discard and Go Back
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Set default dates to today
    const today = new Date().toISOString().split('T')[0];
    document.querySelectorAll('input[type="date"]').forEach(el => el.value = today);
</script>
{% endblock %}
