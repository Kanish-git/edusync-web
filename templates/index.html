<!DOCTYPE html>
<html>

<head>

    <title>EduSync Dashboard</title>

    <style>
        body {
            font-family: Arial;
            background: #0f172a;
            color: white;
            padding: 40px;
        }

        h1 {
            margin-bottom: 20px;
        }

        form {
            margin-bottom: 30px;
            background: #1e293b;
            padding: 20px;
            border-radius: 10px;
        }

        input,
        select {
            padding: 10px;
            margin: 10px;
            border: none;
            border-radius: 6px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #334155;
            padding: 12px;
            text-align: center;
        }

        th {
            background: #1e293b;
        }

        tr {
            background: #111827;
        }
    </style>

</head>

<body>

    <h1>EduSync Student Dashboard 🚀</h1>

    <!-- ADD FORM -->

    <form action="/add" method="POST">

        <input type="text" name="student_name" placeholder="Student Name" required>

        <input type="text" name="register_number" placeholder="Register Number" required>

        <select name="status">

            <option value="Cleared">Cleared</option>
            <option value="Pending">Pending</option>
            <option value="Failed">Failed</option>

        </select>

        <button type="submit">

            Add Student

        </button>

    </form>

    <!-- TABLE -->

    <table>

        <tr>

            <th>ID</th>
            <th>Name</th>
            <th>Register No</th>
            <th>Status</th>

        </tr>

        {% for student in students %}

        <tr>

            <td>{{ student.id }}</td>
            <td>{{ student.student_name }}</td>
            <td>{{ student.register_number }}</td>
            <td>{{ student.status }}</td>

        </tr>

        {% endfor %}

    </table>

</body>

</html>
