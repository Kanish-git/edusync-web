{% extends "base.html" %}
{% block title %}EduSync — Student Registration{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="glass-card p-4 p-md-5">
                <!-- Header Icon & Title -->
                <div class="text-center mb-4">
                    <div style="width: 64px; height: 64px; border-radius: 20px; background: rgba(16, 185, 129, 0.12); color: var(--student); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 16px;">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="8.5" cy="7" r="4"></circle>
                            <line x1="20" y1="8" x2="20" y2="14"></line>
                            <line x1="17" y1="11" x2="23" y2="11"></line>
                        </svg>
                    </div>
                    <span class="badge rounded-pill code-font mb-2" style="background: rgba(16, 185, 129, 0.12); color: var(--student); font-size: 0.72rem; letter-spacing: 1.5px;">ENROLLMENT</span>
                    <h3 class="fw-bold mb-1">Student <span style="background: linear-gradient(90deg, var(--student), var(--tutor)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Registration</span></h3>
                    <p class="text-muted small">Create your student profile to access assignments</p>
                </div>

                <!-- Registration Form -->
                <form action="/register-student" method="POST">
                    <div class="mb-3">
                        <label class="form-label text-muted small fw-semibold text-uppercase code-font">Full Name</label>
                        <div class="input-group">
                            <span class="input-group-text rounded-start-3 border-end-0">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                    <circle cx="12" cy="7" r="4"/>
                                </svg>
                            </span>
                            <input type="text" name="username" class="form-control rounded-end-3 border-start-0" placeholder="e.g. John Doe" required autocomplete="name">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-muted small fw-semibold text-uppercase code-font">Register Number</label>
                        <div class="input-group">
                            <span class="input-group-text rounded-start-3 border-end-0">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                                    <line x1="16" y1="2" x2="16" y2="6"/>
                                    <line x1="8" y1="2" x2="8" y2="6"/>
                                    <line x1="3" y1="10" x2="21" y2="10"/>
                                </svg>
                            </span>
                            <input type="text" name="register_number" class="form-control rounded-end-3 border-start-0 code-font" placeholder="e.g. REG-2026-001" required>
                        </div>
                    </div>

                    <button type="submit" class="btn-premium btn-student-premium w-100 py-3 mb-3">
                        <span>Register Now</span>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
                    </button>
                </form>

                <!-- Footer Links -->
                <div class="text-center pt-2">
                    <p class="text-muted small mb-2">Already registered? <a href="/student-login" class="fw-semibold text-decoration-none" style="color: var(--student);">Login here</a></p>
                    <a href="/" class="text-muted small text-decoration-none d-inline-flex align-items-center gap-1" style="opacity: 0.7;">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                        <span>Back to Home</span>
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
