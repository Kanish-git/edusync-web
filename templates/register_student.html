{% extends "base.html" %}
{% block title %}Student Registration{% endblock %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="glass-card p-5">
                <div class="text-center mb-5">
                    <div class="p-3 bg-info bg-opacity-10 rounded-circle d-inline-block mb-3">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-info">
                            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="8.5" cy="7" r="4"></circle>
                            <line x1="20" y1="8" x2="20" y2="14"></line>
                            <line x1="17" y1="11" x2="23" y2="11"></line>
                        </svg>
                    </div>
                    <h3 class="fw-bold mb-1">Student <span class="text-gradient">Registration</span></h3>
                    <p class="text-muted small">Begin your educational journey</p>
                </div>
                <form method="POST" action="/register-student">
                    <div class="mb-4">
                        <label class="form-label text-muted small fw-bold text-uppercase">Full Name</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 rounded-start-3"><svg width="18"
                                    height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round" class="text-muted">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                    <circle cx="12" cy="7" r="4"></circle>
                                </svg></span>
                            <input type="text" name="username" class="form-control border-start-0 rounded-end-3"
                                placeholder="Enter your full name" required>
                        </div>
                    </div>
                    <div class="mb-5">
                        <label class="form-label text-muted small fw-bold text-uppercase">Register Number</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 rounded-start-3"><svg width="18"
                                    height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round" class="text-muted">
                                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                                    <line x1="16" y1="2" x2="16" y2="6"></line>
                                    <line x1="8" y1="2" x2="8" y2="6"></line>
                                    <line x1="3" y1="10" x2="21" y2="10"></line>
                                </svg></span>
                            <input type="text" name="register_number" class="form-control border-start-0 rounded-end-3"
                                placeholder="e.g. REG-2024-001" required>
                        </div>
                    </div>
                    <button type="submit" class="btn-premium w-100 py-3 mb-4">Register Now</button>
                </form>
                <div class="text-center">
                    <p class="text-muted small">Already registered? <a href="{{ url_for('student_login') }}"
                            class="text-primary fw-bold text-decoration-none">Login here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
