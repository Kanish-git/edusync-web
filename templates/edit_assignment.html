{% extends "base.html" %}
{% block title %}Edit Assignment{% endblock %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="glass-card p-5">
                <div class="text-center mb-5">
                    <div class="p-4 bg-secondary bg-opacity-10 rounded-circle d-inline-block mb-3">
                        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-secondary"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                    </div>
                    <h3 class="fw-bold mb-1">Edit <span class="text-gradient">Assignment</span></h3>
                    <p class="text-muted small">Update your teaching materials and deadlines</p>
                </div>

                <form method="POST" enctype="multipart/form-data">
                    <div class="mb-4">
                        <label class="form-label text-muted small fw-bold text-uppercase">Topic Title</label>
                        <input type="text" name="topic" class="form-control" value="{{ assignment.topic }}" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-muted small fw-bold text-uppercase">Detailed Instructions</label>
                        <textarea name="description" class="form-control" rows="5" required>{{ assignment.description }}</textarea>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label text-muted small fw-bold text-uppercase">Update Document (PDF/DOCX)</label>
                        <input type="file" name="attachment" class="form-control mb-2">
                        {% if assignment.attachment_path %}
                            <div class="text-muted small d-flex align-items-center">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="me-1"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                                Current: <a href="{{ url_for('uploaded_file', filename=assignment.attachment_path) }}" class="ms-1 text-primary" target="_blank">{{ assignment.attachment_path }}</a>
                            </div>
                        {% endif %}
                    </div>

                    <div class="row mb-5">
                        <div class="col-md-6">
                            <label class="form-label text-muted small fw-bold text-uppercase">Start Date</label>
                            <input type="date" name="start_date" class="form-control" value="{{ assignment.start_date }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-muted small fw-bold text-uppercase">End Date</label>
                            <input type="date" name="end_date" class="form-control" value="{{ assignment.end_date }}" required>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn-premium w-100 py-3 mb-4">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="me-2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                        Save All Changes
                    </button>
                </form>

                <div class="text-center">
                    <a href="{{ url_for('tutor.manage_assignments') }}" class="text-muted small text-decoration-none">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="me-1"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                        Cancel Edits
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
