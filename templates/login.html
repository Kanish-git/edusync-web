{% extends "base.html" %}
{% block title %}Tutor Login{% endblock %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="glass-card p-5">
                <div class="text-center mb-5">
                    <div class="p-3 bg-primary bg-opacity-10 rounded-circle d-inline-block mb-3">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-primary"><path d="M12 2L2 7l10 5 10-5-10-5z"></path><path d="M2 17l10 5 10-5"></path><path d="M2 12l10 5 10-5"></path></svg>
                    </div>
                    <h3 class="fw-bold mb-1">Tutor <span class="text-gradient">Login</span></h3>
                    <p class="text-muted small">Access your educator dashboard</p>
                </div>

                <form method="POST">
                    <div class="mb-4">
                        <label class="form-label text-muted small fw-bold text-uppercase">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 rounded-start-3"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-muted"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></span>
                            <input type="text" name="username" class="form-control border-start-0 rounded-end-3" placeholder="Enter username" required>
                        </div>
                    </div>
                    <div class="mb-5">
                        <label class="form-label text-muted small fw-bold text-uppercase">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 rounded-start-3"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-muted"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></span>
                            <input type="password" name="password" class="form-control border-start-0 rounded-end-3" placeholder="••••••••" required>
                        </div>
                    </div>
                    <button type="submit" class="btn-premium w-100 py-3 mb-4">Sign In</button>
                </form>

                <div class="text-center">
                    <p class="text-muted small">Don't have an account? <a href="{{ url_for('auth.register_tutor') }}" class="text-primary fw-bold text-decoration-none">Register here</a></p>
                    <a href="/" class="text-muted small text-decoration-none"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="me-1"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg> Back to Home</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
