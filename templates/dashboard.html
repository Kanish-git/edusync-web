{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <h2 class="text-center fw-bold">Tutor Dashboard</h2>
    <div class="row justify-content-center mt-4">
        <div class="col-md-6 card p-4 shadow-sm">
            <h4 class="fw-bold mb-3"><i class="fas fa-upload text-primary me-2"></i>Upload Topic of the Day</h4>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Topic Name</label>
                    <input type="text" name="topic_name" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Assignment Description</label>
                    <textarea name="task_description" class="form-control" rows="4" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary w-100">Post Assignment</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
